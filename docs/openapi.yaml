          $ref: '#/components/schemas/RetrievalConfiguration'
    RetrievalFirstRoundOverride:
      type: object
      additionalProperties: false
      properties:
        termExpansionEnabled: {type: boolean}
        terminologyResourceId:
          type: string
          minLength: 1
          maxLength: 128
        maximumExpansionTerms:
          type: integer
          minimum: 0
          maximum: 64
    RetrievalBranchOverride:
