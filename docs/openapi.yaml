openapi: 3.0.3
info:
  title: Infinity Knowledge Control Plane API
  version: 1.0.0
  description: |
    Machine-readable contract for the implemented `/api/v1` HTTP surface.
    Every operation requires an OIDC bearer token. Operations described as
    administrator-only additionally require the `knowledge-admin` realm role.
    Tenant and principal identity are derived exclusively from the validated token.
servers:
  - url: http://localhost:8080
    description: Local control plane
security:
  - bearerAuth: []
tags:
  - name: Spaces
  - name: Documents
  - name: Extraction
  - name: Projections
  - name: Query
  - name: Connectors
  - name: Management
  - name: Evaluations
  - name: Traces
  - name: Audit
  - name: Graph
  - name: Wiki
paths:
  /api/v1/document-processing-capabilities:
    get:
      tags: [Spaces]
      operationId: getDocumentProcessingCapabilities
      summary: Get safe document-processing defaults and installed capabilities
      description: |
        Requires `knowledge-admin`. This endpoint does not depend on an existing Space and
        is used by the Space creation form. It returns stable IDs, availability and safe
        defaults, but never model endpoints, credentials or deployment secrets.
      responses:
        '200':
          description: Safe defaults and installed Parser, Chunker, Tokenizer and Embedding capabilities
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentProcessingCapabilities'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/spaces:
    post:
      tags: [Spaces]
      operationId: createSpace
      summary: Create a tenant knowledge space with immutable processing configuration
      description: |
        Requires `knowledge-admin`. For a new ID, the server validates the complete
        document-processing configuration and atomically commits the Space, immutable
        configuration, creator administrator ACL and API upload Connector. The required
        description explains the Space purpose to users and participates in Space Router
        matching. An exact repeated request is idempotent and does not overwrite the stored
        definition; a reused ID with a different name, description, configuration or
        non-ACTIVE state is rejected.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSpaceRequest'
      responses:
        '204':
          description: Space exists and has been provisioned
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/KnowledgeSpaceConflict'
  /api/v1/spaces/accessible:
    get:
      tags: [Spaces]
      operationId: listAccessibleSpaces
      summary: List active spaces readable by the current principal
      responses:
        '200':
          description: Accessible spaces
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AccessibleSpace'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/spaces/{spaceId}/acl:
    parameters:
      - $ref: '#/components/parameters/SpaceId'
    get:
      tags: [Spaces]
      operationId: listSpaceAcl
      summary: List exact ACL grants for a space
      description: Requires `knowledge-admin`.
      responses:
        '200':
          description: ACL grants
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SpaceGrant'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Spaces]
      operationId: grantSpaceAcl
      summary: Idempotently add an exact ACL grant
      description: Requires `knowledge-admin`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SpaceAclRequest'
      responses:
        '204':
          description: Grant exists
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    delete:
      tags: [Spaces]
      operationId: revokeSpaceAcl
      summary: Revoke an exact ACL grant
      description: Requires `knowledge-admin`; revoking a missing grant is still successful.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SpaceAclRequest'
      responses:
        '204':
          description: Exact grant is absent
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/spaces/{spaceId}/document-processing-config:
    parameters:
      - $ref: '#/components/parameters/SpaceId'
    get:
      tags: [Spaces]
      operationId: getSpaceDocumentProcessingConfig
      summary: Get the document processing configuration for a space
      description: |
        Requires `knowledge-admin`. The returned configuration was stored when the
        Space was created and is immutable. Changing formal processing semantics requires
        a new Space; TEST_ONLY runs may supply a complete per-run testConfig without
        changing it. A valid testConfig can run even if an unused fixed Space adapter was
        later disabled; this is an explicit test override, never a formal fallback.
      responses:
        '200':
          description: Immutable Space configuration, creation audit and installed capabilities
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpaceDocumentProcessingConfig'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/spaces/{spaceId}/retrieval-configuration:
    parameters:
      - $ref: '#/components/parameters/SpaceId'
    get:
      tags: [Spaces, Query]
      operationId: getSpaceRetrievalConfiguration
      summary: Get the current immutable retrieval configuration revision
      description: |
        Requires read access to the Space. The response identifies the complete materialized
        retrieval configuration, immutable revision and semantic fingerprint actually used as
        the base for request overrides.
      responses:
        '200':
          description: Current Space retrieval configuration revision
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpaceRetrievalConfiguration'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/SpaceRetrievalConfigurationNotFound'
    put:
      tags: [Spaces, Query]
      operationId: updateSpaceRetrievalConfiguration
      summary: Append and atomically select a complete retrieval configuration revision
      description: |
        Requires `knowledge-admin`. The request uses optimistic revision matching. Identical
        retries are idempotent; a stale revision with different content is rejected rather than
        overwriting another update. Index-generation and embedding-shape settings are outside
        this mutable configuration.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSpaceRetrievalConfigurationRequest'
      responses:
        '200':
          description: Current revision after the idempotent append/select operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpaceRetrievalConfiguration'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/SpaceRetrievalConfigurationNotFound'
        '409':
          $ref: '#/components/responses/SpaceRetrievalConfigurationConflict'
  /api/v1/spaces/{spaceId}/retrieval-configuration/history:
    parameters:
      - $ref: '#/components/parameters/SpaceId'
    get:
      tags: [Spaces, Query]
      operationId: listSpaceRetrievalConfigurationHistory
      summary: List immutable retrieval configuration revisions newest first
      description: Requires read access to the Space.
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 20
      responses:
        '200':
          description: Bounded immutable revision history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SpaceRetrievalConfiguration'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/SpaceRetrievalConfigurationNotFound'
  /api/v1/spaces/{spaceId}/projections/rebuild:
    parameters:
      - $ref: '#/components/parameters/SpaceId'
    post:
      tags: [Projections]
      operationId: rebuildSpaceProjections
      summary: Requeue configured projections for active revisions in a space
      description: Requires `knowledge-admin`.
      responses:
        '200':
          description: Rebuild enqueue result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectionRebuildResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/spaces/{spaceId}/extraction-runs:
    parameters:
      - $ref: '#/components/parameters/SpaceId'
    post:
      tags: [Extraction]
      operationId: createExtractionRun
      summary: Upload multiple sources and create a TEST_ONLY extraction run
      description: |
        Requires `knowledge-admin`. Each source is bounded, hashed and retained in
        object storage independently. The run executes Parse, Clean and Chunk only;
        it never writes Document, Revision or Projection records. The immutable
        effective configuration is captured before the sources are accepted. An
        optional full test configuration applies only to this TEST_ONLY run:
        the server canonicalizes it, validates installed Parser/Chunker/Tokenizer
        capabilities and captures the canonical snapshot without updating the
        immutable Space configuration.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [files]
              properties:
                files:
                  type: array
                  minItems: 1
                  maxItems: 10
                  items:
                    type: string
                    format: binary
                language:
                  type: string
                  default: zh-CN
                  maxLength: 32
                datasetId:
                  type: string
                  description: Optional governed Dataset id. A real Gate remains NOT_EVALUATED until all cases can be observed.
                baselineRunId:
                  type: string
                  format: uuid
                  description: |
                    Optional comparable Baseline: a TEST_ONLY SUCCEEDED run in the
                    same tenant, space, immutable Dataset and normalized language,
                    whose Gate is PASSED or FAILED.
                testConfig:
                  $ref: '#/components/schemas/DocumentProcessingConfiguration'
            encoding:
              testConfig:
                contentType: application/json
      responses:
        '202':
          description: Sources retained and extraction run queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExtractionRunDetail'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/ExtractionRunActive'
        '413':
          $ref: '#/components/responses/SourceTooLarge'
    get:
      tags: [Extraction]
      operationId: listExtractionRuns
      summary: List recent extraction runs for one space
      description: Requires `knowledge-admin`; the server applies a bounded list limit.
      responses:
        '200':
          description: Recent run summaries ordered by creation time descending
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ExtractionRunSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/spaces/{spaceId}/ingestion-runs:
    parameters:
      - $ref: '#/components/parameters/SpaceId'
    post:
      tags: [Extraction]
      operationId: createIngestionRun
      summary: Retain multiple sources and create an asynchronous INGEST run
      description: |
        Requires `knowledge-admin`. Files are paired with manifest items by array
        order. The server captures the Space processing configuration once, retains
        every original source, and asynchronously performs Parse, Clean, Chunk and
        transactional publication. An identical active source is skipped; the same
        externalId with different content fails instead of overwriting it. Parser or
        Chunker upload-time overrides are not accepted.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [files, manifest]
              properties:
                files:
                  type: array
                  minItems: 1
                  maxItems: 10
                  items:
                    type: string
                    format: binary
                manifest:
                  $ref: '#/components/schemas/IngestionManifest'
                language:
                  type: string
                  default: zh-CN
                  maxLength: 32
            encoding:
              manifest:
                contentType: application/json
      responses:
        '202':
          description: Sources retained and formal ingestion run queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExtractionRunDetail'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/ExtractionRunActive'
        '413':
          $ref: '#/components/responses/SourceTooLarge'
  /api/v1/spaces/{spaceId}/extraction-runs/{runId}:
    parameters:
      - $ref: '#/components/parameters/SpaceId'
      - name: runId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Extraction]
      operationId: getExtractionRun
      summary: Get one run and its per-file diagnostics
      responses:
        '200':
          description: Extraction run detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExtractionRunDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ExtractionRunNotFound'
  /api/v1/spaces/{spaceId}/extraction-datasets:
    parameters:
      - $ref: '#/components/parameters/SpaceId'
    get:
      tags: [Extraction]
      operationId: listExtractionDatasets
      summary: List governed extraction datasets without source content
      description: Requires `knowledge-admin`; descriptors expose provenance metadata but never Golden Source text.
      responses:
        '200':
          description: Available server-side extraction datasets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ExtractionDataset'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/spaces/{spaceId}/extraction-datasets/{datasetId}/runs:
    parameters:
      - $ref: '#/components/parameters/SpaceId'
      - name: datasetId
        in: path
        required: true
        schema:
          type: string
    post:
      tags: [Extraction]
      operationId: createExtractionDatasetRun
      summary: Run server-side Golden Sources through the real extraction pipeline
      description: |
        Requires `knowledge-admin`. Golden Sources use the same OSS, Parse, Clean and
        Chunk task path as uploads. Run SUCCEEDED and Gate PASSED are independent results.
        An optional full test configuration is canonicalized, capability-checked
        and captured for this TEST_ONLY run only; it never updates the Space active
        configuration. A Baseline must use the same immutable Dataset and normalized
        language, and must already be TEST_ONLY, SUCCEEDED with Gate PASSED or FAILED.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExtractionDatasetRunRequest'
      responses:
        '202':
          description: Dataset sources retained and TEST_ONLY run queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExtractionRunDetail'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/ExtractionRunActive'
  /api/v1/spaces/{spaceId}/extraction-runs/{runId}/cancel:
    parameters:
      - $ref: '#/components/parameters/SpaceId'
      - name: runId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [Extraction]
      operationId: cancelExtractionRun
      summary: Request cooperative cancellation
      description: |
        Queued runs cancel immediately; running runs stop at a safe file boundary.
        An INGEST item already in PUBLISHING rejects cancellation with a stable 409.
      responses:
        '202':
          description: Latest run state after accepting the cancellation request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExtractionRunDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ExtractionRunNotFound'
        '409':
          $ref: '#/components/responses/ExtractionPublicationInProgress'
  /api/v1/spaces/{spaceId}/extraction-runs/{runId}/items/{itemId}/source:
    parameters:
      - $ref: '#/components/parameters/SpaceId'
      - name: runId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: itemId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Extraction]
      operationId: downloadExtractionSource
      summary: Download the authorized original source for one run item
      description: Requires `knowledge-admin`; physical object-storage keys are never returned.
      responses:
        '200':
          description: Original source using its registered media type, as an attachment with no-store and nosniff headers
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ExtractionRunNotFound'
  /api/v1/documents/markdown:
    post:
      tags: [Documents]
      operationId: ingestMarkdown
      summary: Ingest or idempotently update a Markdown document
      description: Requires `knowledge-admin`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MarkdownDocumentRequest'
      responses:
        '200':
          description: Active revision and projection admission status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarkdownDocumentResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/documents/{documentId}/source:
    parameters:
      - $ref: '#/components/parameters/DocumentId'
    get:
      tags: [Documents]
      operationId: getDocumentSourceMetadata
      summary: Get authorized original-source metadata
      description: Tenant administrators may inspect retained inactive sources; other callers must have access to an active document.
      responses:
        '200':
          description: Source metadata without object-store coordinates
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceObjectResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/DocumentNotFound'
  /api/v1/documents/{documentId}/source/content:
    parameters:
      - $ref: '#/components/parameters/DocumentId'
    get:
      tags: [Documents]
      operationId: downloadDocumentSource
      summary: Stream an authorized original source
      description: Tenant administrators may inspect retained inactive sources; other callers must have access to an active document.
      parameters:
        - name: inline
          in: query
          required: false
          description: Request a sandboxed inline response when the media type is previewable.
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Source bytes; unsafe types remain attachments even when inline is requested
          headers:
            Content-Disposition:
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
            text/plain:
              schema:
                type: string
                format: binary
            text/markdown:
              schema:
                type: string
                format: binary
            text/html:
              schema:
                type: string
                format: binary
            application/pdf:
              schema:
                type: string
                format: binary
            application/vnd.openxmlformats-officedocument.wordprocessingml.document:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/DocumentNotFound'
  /api/v1/documents/{documentId}/status:
    parameters:
      - $ref: '#/components/parameters/DocumentId'
    patch:
      tags: [Documents]
      operationId: transitionDocumentStatus
      summary: Apply a reversible document lifecycle transition
      description: Requires `knowledge-admin` and optimistic version matching.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentLifecycleRequest'
      responses:
        '200':
          description: Current lifecycle state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentLifecycleResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/DocumentLifecycleConflict'
  /api/v1/documents/{documentId}/projections:
    parameters:
      - $ref: '#/components/parameters/DocumentId'
    get:
      tags: [Projections]
      operationId: listDocumentProjections
      summary: List current-revision asynchronous projection jobs
      description: Requires `knowledge-admin`.
      responses:
        '200':
          description: Projection jobs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProjectionJobResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/documents/{documentId}/projections/{projectionType}/retry:
    parameters:
      - $ref: '#/components/parameters/DocumentId'
      - $ref: '#/components/parameters/ProjectionType'
    post:
      tags: [Projections]
      operationId: retryDocumentProjection
      summary: Requeue a dead-lettered current-revision projection
      description: Requires `knowledge-admin`.
      responses:
        '200':
          description: Whether a job was requeued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectionRetryResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/knowledge/query:
    post:
      tags: [Query]
      operationId: queryKnowledge
      summary: Retrieve an ACL-filtered evidence bundle
      description: |
        The runtime is stateless and expects a standalone query. The original query always
        remains in retrieval. The request may apply a typed, bounded override to the first
        visited Space configuration; it cannot override tenant, Space authorization or
        deployment hard limits. `testMode` isolates observation metrics by purpose without
        bypassing the real retrieval path.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KnowledgeQueryRequest'
      responses:
        '200':
          description: Evidence bundle and trace identity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeQueryResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/retrieval-observations/requests/{requestId}:
    parameters:
      - $ref: '#/components/parameters/RequestId'
    get:
      tags: [Query, Evaluations]
      operationId: getRetrievalObservationByRequest
      summary: Get the latest safe retrieval execution report for a request
      description: |
        Reads only inside the JWT tenant and requires the current principal to retain access
        to every Space involved in the report. The response excludes raw event payloads,
        query text, candidate or Chunk content and model raw responses. A short 404 retry can
        be used after query completion while an alternative asynchronous event transport is in use.
      responses:
        '200':
          description: Ordered stage facts, configuration identities and versioned metrics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetrievalObservationReport'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/RetrievalObservationNotFound'
  /api/v1/connectors/obsidian:
    post:
      tags: [Connectors]
      operationId: configureObsidianConnector
      summary: Create or update an allowlisted local Obsidian connector
      description: Requires `knowledge-admin`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ObsidianConnectorRequest'
      responses:
        '204':
          description: Connector configuration stored
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/connectors/{connectorId}/sync:
    parameters:
      - $ref: '#/components/parameters/ConnectorId'
    post:
      tags: [Connectors]
      operationId: synchronizeConnector
      summary: Start an asynchronous connector synchronization
      description: Requires `knowledge-admin`.
      responses:
        '202':
          description: Synchronization accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectorSyncResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/OperationInProgress'
        '503':
          $ref: '#/components/responses/WorkQueueSaturated'
  /api/v1/connectors/runs/{runId}:
    parameters:
      - $ref: '#/components/parameters/RunId'
    get:
      tags: [Connectors]
      operationId: getConnectorRun
      summary: Get a tenant-bound connector synchronization run
      description: Requires `knowledge-admin`.
      responses:
        '200':
          description: Synchronization run state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectorRunResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/admin/overview:
    get:
      tags: [Management]
      operationId: getAdminOverview
      summary: Get tenant management counters
      description: Requires `knowledge-admin`.
      responses:
        '200':
          description: Overview counters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagementOverview'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/admin/spaces:
    get:
      tags: [Management]
      operationId: listAdminSpaces
      summary: List tenant spaces for administration
      description: Requires `knowledge-admin`.
      responses:
        '200':
          description: Tenant spaces
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ManagementSpace'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/admin/documents:
    get:
      tags: [Management]
      operationId: listAdminDocuments
      summary: Page tenant documents for administration
      description: |
        Requires `knowledge-admin`. Deleted documents are omitted unless `status=DELETED`
        is explicitly requested. Optional filters are combined with AND semantics.
      parameters:
        - name: spaceId
          in: query
          schema:
            type: string
        - name: status
          in: query
          description: Document lifecycle status; omit it to exclude deleted documents.
          schema:
            $ref: '#/components/schemas/DocumentStatus'
        - name: title
          in: query
          description: Case-insensitive substring of the document title.
          schema:
            type: string
        - name: source
          in: query
          description: Case-insensitive substring of source type, source URI or original file name.
          schema:
            type: string
        - name: keywordStatus
          in: query
          description: Keyword projection status for the active revision.
          schema:
            type: string
            enum: [PENDING, SUCCEEDED, FAILED, SKIPPED]
        - name: vectorStatus
          in: query
          description: Vector projection status for the active revision.
          schema:
            type: string
            enum: [PENDING, SUCCEEDED, FAILED, SKIPPED]
        - name: minimumChunkCount
          in: query
          description: Inclusive minimum Chunk count for the active revision.
          schema:
            type: integer
            minimum: 0
        - name: maximumChunkCount
          in: query
          description: Inclusive maximum Chunk count for the active revision.
          schema:
            type: integer
            minimum: 0
        - name: updatedFrom
          in: query
          description: Inclusive lower bound for the document update time.
          schema:
            type: string
            format: date-time
        - name: updatedTo
          in: query
          description: Inclusive upper bound for the document update time.
          schema:
            type: string
            format: date-time
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 200
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
            minimum: 0
      responses:
        '200':
          description: Document page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/admin/documents/{documentId}:
    parameters:
      - $ref: '#/components/parameters/DocumentId'
    get:
      tags: [Management]
      operationId: getAdminDocument
      summary: Get one tenant document summary for the administration detail page
      description: Requires `knowledge-admin`; tenant isolation is always enforced.
      responses:
        '200':
          description: Document summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagementDocument'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/DocumentNotFound'
  /api/v1/admin/documents/{documentId}/chunks:
    parameters:
      - $ref: '#/components/parameters/DocumentId'
    get:
      tags: [Management]
      operationId: listAdminDocumentChunks
