  /api/v1/admin/wiki/pages/{pageId}:
    parameters:
      - $ref: '#/components/parameters/PageId'
    get:
      tags: [Wiki]
      operationId: getWikiPage
      summary: Get Wiki page, latest revision and active revision
      description: Requires `knowledge-admin`.
      responses:
        '200':
          description: Wiki page detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WikiPageDetail'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/admin/wiki/pages/{pageId}/submit-review:
    parameters:
      - $ref: '#/components/parameters/PageId'
    post:
      tags: [Wiki]
      operationId: submitWikiPageForReview
      summary: Transition a Wiki page to IN_REVIEW
      description: Requires `knowledge-admin` and optimistic version matching.
      requestBody:
        $ref: '#/components/requestBodies/WikiTransition'
      responses:
        '200':
          $ref: '#/components/responses/WikiPageDetail'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/WikiConflict'
  /api/v1/admin/wiki/pages/{pageId}/reject:
    parameters:
      - $ref: '#/components/parameters/PageId'
    post:
      tags: [Wiki]
      operationId: rejectWikiPage
      summary: Transition a Wiki page back to DRAFT
      description: Requires `knowledge-admin` and optimistic version matching.
      requestBody:
        $ref: '#/components/requestBodies/WikiTransition'
      responses:
        '200':
          $ref: '#/components/responses/WikiPageDetail'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/WikiConflict'
  /api/v1/admin/wiki/pages/{pageId}/publish:
    parameters:
      - $ref: '#/components/parameters/PageId'
    post:
      tags: [Wiki]
      operationId: publishWikiPage
      summary: Transition a Wiki page to PUBLISHED
      description: Requires `knowledge-admin` and optimistic version matching.
      requestBody:
        $ref: '#/components/requestBodies/WikiTransition'
      responses:
        '200':
          $ref: '#/components/responses/WikiPageDetail'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/WikiConflict'
  /api/v1/admin/wiki/pages/{pageId}/archive:
    parameters:
      - $ref: '#/components/parameters/PageId'
    post:
      tags: [Wiki]
      operationId: archiveWikiPage
      summary: Transition a Wiki page to ARCHIVED
      description: Requires `knowledge-admin` and optimistic version matching.
      requestBody:
        $ref: '#/components/requestBodies/WikiTransition'
      responses:
        '200':
          $ref: '#/components/responses/WikiPageDetail'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/WikiConflict'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    SpaceId:
      name: spaceId
      in: path
      required: true
      schema:
        type: string
        maxLength: 64
    DocumentId:
      name: documentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RevisionId:
      name: revisionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ConnectorId:
      name: connectorId
      in: path
      required: true
      schema:
        type: string
        maxLength: 128
    ProjectionType:
      name: projectionType
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ProjectionType'
    DatasetId:
      name: datasetId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RunId:
      name: runId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TraceId:
      name: traceId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RequestId:
      name: requestId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PageId:
      name: pageId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  requestBodies:
    WikiTransition:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/WikiTransitionRequest'
  responses:
    Unauthorized:
      description: Bearer token is absent or invalid
    Forbidden:
      description: The authenticated principal is not allowed to perform the operation
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    InvalidRequest:
      description: Request validation, parsing or domain argument failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    DocumentNotFound:
      description: The requested authorized document source does not exist
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    DocumentLifecycleConflict:
      description: Optimistic version or lifecycle transition conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    OperationInProgress:
      description: The same resource already has an operation in progress
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    KnowledgeSpaceConflict:
      description: |
        The Space ID already exists but its name, immutable processing configuration
        or lifecycle state differs from the creation request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    SpaceRetrievalConfigurationNotFound:
      description: The requested authorized Space has no retrieval configuration
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    SpaceRetrievalConfigurationConflict:
      description: The expected retrieval configuration revision is stale or conflicts
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    RetrievalObservationNotFound:
      description: No retrieval observation exists for this request inside the JWT tenant
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    WorkQueueSaturated:
      description: The bounded asynchronous work queue cannot accept more work
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    GraphCapabilityUnavailable:
      description: The Graph adapter is not enabled for this deployment
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    SourceTooLarge:
      description: Uploaded source exceeds the configured limit
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    ExtractionRunActive:
      description: The space already has a QUEUED, RUNNING or CANCEL_REQUESTED run
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    ExtractionPublicationInProgress:
      description: An INGEST item is inside the non-cancellable publication transaction window
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    ExtractionRunNotFound:
      description: The requested run or item does not exist in the authorized space
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    WikiConflict:
      description: Optimistic version or Wiki lifecycle transition conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    WikiPageDetail:
      description: Current Wiki page detail
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/WikiPageDetail'
  schemas:
    ApiError:
      type: object
      required: [code, message, requestId, timestamp]
      properties:
        code:
          type: string
        message:
          type: string
        requestId:
          type: string
        timestamp:
          type: string
          format: date-time
    CreateSpaceRequest:
      type: object
      required: [spaceId, name, description, documentProcessingConfig]
      properties:
        spaceId:
          type: string
          minLength: 1
          maxLength: 64
        name:
          type: string
          minLength: 1
          maxLength: 256
        description:
          type: string
          minLength: 1
          maxLength: 2000
          description: Space purpose shown to users and used as input for Space Router matching.
        documentProcessingConfig:
          $ref: '#/components/schemas/DocumentProcessingConfiguration'
    AccessibleSpace:
      type: object
      required: [id, name, description, status, version, documentCount, updatedAt]
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        status:
          type: string
        version:
          type: integer
          format: int64
        documentCount:
          type: integer
          format: int64
        updatedAt:
          type: string
          format: date-time
    SpaceAclRequest:
      type: object
      required: [subjectType, subjectId, permission]
      properties:
        subjectType:
          type: string
          enum: [USER, ROLE, DEPARTMENT, TENANT]
          maxLength: 32
        subjectId:
          type: string
          minLength: 1
          maxLength: 128
        permission:
          type: string
          enum: [READ, WRITE, ADMIN]
          maxLength: 32
    SpaceGrant:
      allOf:
        - $ref: '#/components/schemas/SpaceAclRequest'
    DocumentProcessingConfiguration:
      type: object
      description: |
        A complete, versionless processing configuration shared by Space creation and
        per-run TEST_ONLY overrides. It is not a separately promoted resource.
      required: [parserSelections, cleaning, chunker]
      properties:
        parserSelections:
          type: array
          minItems: 1
          maxItems: 32
          items:
            $ref: '#/components/schemas/SpaceParserSelection'
        cleaning:
          $ref: '#/components/schemas/DocumentCleaningConfiguration'
        chunker:
          $ref: '#/components/schemas/SpaceChunkerConfiguration'
    DocumentProcessingContract:
      type: object
      description: Space 创建时固化的实际处理实现合同；仅用于审计和检测部署实现漂移。
      required:
        - pipelineContract
        - normalizerSchemaContract
        - parserContracts
        - cleanerContract
        - chunkerContract
        - fingerprint
      properties:
        pipelineContract:
          type: string
          minLength: 1
        normalizerSchemaContract:
          type: string
          minLength: 1
        parserContracts:
          type: object
          minProperties: 1
          additionalProperties:
            type: string
            minLength: 1
        cleanerContract:
          type: string
          minLength: 1
        chunkerContract:
          type: string
          minLength: 1
          description: 包含 Chunker Provider、Tokenizer、模型预算与实现版本材料。
        fingerprint:
          type: string
          pattern: '^[0-9a-f]{64}$'
    DocumentProcessingCapabilities:
      type: object
      description: |
        Space 创建表单使用的安全默认配置和部署能力目录；不包含模型 Endpoint、凭据
        或其他部署秘密。提交创建请求时服务端仍会重新校验全部能力。该默认配置覆盖
        创建当时全部规范格式；已有 Space 的固化映射不会因后来安装 Adapter 而被补齐。
      required:
        - defaultConfig
        - availableParsers
        - availableChunkers
        - availableTokenizers
        - availableEmbeddingProfiles
      properties:
        defaultConfig:
          $ref: '#/components/schemas/DocumentProcessingConfiguration'
        availableParsers:
          type: array
          items:
            $ref: '#/components/schemas/AvailableParser'
        availableChunkers:
          type: array
          items:
            $ref: '#/components/schemas/AvailableChunker'
        availableTokenizers:
          type: array
          items:
            $ref: '#/components/schemas/AvailableTokenizer'
        availableEmbeddingProfiles:
          type: array
          items:
            $ref: '#/components/schemas/AvailableEmbeddingProfile'
    SpaceDocumentProcessingConfig:
      type: object
      required:
        - spaceId
        - version
        - updatedAt
        - updatedBy
        - processingContract
        - runtimeContractMatched
        - parserSelections
        - cleaning
        - chunker
        - availableParsers
        - availableChunkers
        - availableTokenizers
        - availableEmbeddingProfiles
      properties:
        spaceId:
          type: string
          minLength: 1
          maxLength: 64
        version:
          type: integer
          format: int64
          enum: [1]
          description: Fixed at creation; this is not an editable configuration revision.
        updatedAt:
          type: string
          format: date-time
        updatedBy:
          type: string
          minLength: 1
          maxLength: 128
        processingContract:
          $ref: '#/components/schemas/DocumentProcessingContract'
        runtimeContractMatched:
          type: boolean
          description: |
            当前部署实现是否与 Space 创建时固化合同完全一致；false 时禁止使用 Space 固化配置
            继续正式摄取。完整且当前可执行的 TEST_ONLY 本次测试配置仍可独立运行。
        parserSelections:
          type: array
          minItems: 1
          maxItems: 32
          items:
            $ref: '#/components/schemas/SpaceParserSelection'
        cleaning:
          $ref: '#/components/schemas/DocumentCleaningConfiguration'
        chunker:
          $ref: '#/components/schemas/SpaceChunkerConfiguration'
        availableParsers:
          type: array
          items:
            $ref: '#/components/schemas/AvailableParser'
        availableChunkers:
          type: array
          items:
            $ref: '#/components/schemas/AvailableChunker'
        availableTokenizers:
          type: array
          items:
            $ref: '#/components/schemas/AvailableTokenizer'
        availableEmbeddingProfiles:
          type: array
          items:
            $ref: '#/components/schemas/AvailableEmbeddingProfile'
    SpaceParserSelection:
      type: object
      required: [mediaType, parserId]
      properties:
        mediaType:
          type: string
          minLength: 1
          maxLength: 128
        parserId:
          type: string
          minLength: 1
          maxLength: 128
    DocumentCleaningConfiguration:
      type: object
      description: |
        Processing action for roles explicitly identified by the selected Parser.
        Hidden content remains a non-configurable server-side safety exclusion.
      required: [header, footer, pageNumber, watermark, frontMatter]
      properties:
        header:
          $ref: '#/components/schemas/DocumentCleaningAction'
        footer:
          $ref: '#/components/schemas/DocumentCleaningAction'
        pageNumber:
          $ref: '#/components/schemas/DocumentCleaningAction'
        watermark:
          $ref: '#/components/schemas/DocumentCleaningAction'
        frontMatter:
          $ref: '#/components/schemas/DocumentCleaningAction'
    DocumentCleaningAction:
      type: string
      enum: [KEEP, REMOVE, METADATA_ONLY]
      description: Keep as searchable content, remove, or retain only as governance metadata.
    SpaceChunkerConfiguration:
      type: object
      description: |
        Space selection, common Token budget and provider-specific canonical
        configuration. Built-ins are STRUCTURAL and SEMANTIC_REFINEMENT. Provider IDs
        and Token Counter IDs must be selected from the returned capability directories.
      required:
        - providerId
        - tokenizerId
        - minimumTokens
        - targetTokens
        - maximumTokens
        - overlapTokens
        - providerConfig
      properties:
        providerId:
          type: string
          minLength: 1
          maxLength: 64
          pattern: '^[A-Z][A-Z0-9_]{0,63}$'
          description: Stable installed Chunker Provider ID; not a closed enum.
        tokenizerId:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$'
          description: Stable installed Token Counter ID.
        minimumTokens:
          type: integer
          minimum: 1
          maximum: 65536
        targetTokens:
          type: integer
          minimum: 1
          maximum: 65536
          description: Must be greater than or equal to minimumTokens.
        maximumTokens:
          type: integer
          minimum: 1
          maximum: 65536
          description: Must be greater than or equal to targetTokens.
        overlapTokens:
          type: integer
          minimum: 0
          maximum: 65535
          description: Must be strictly less than minimumTokens.
        providerConfig:
          $ref: '#/components/schemas/ChunkerProviderConfiguration'
    ChunkerProviderConfiguration:
      type: object
      maxProperties: 16
      description: |
        Provider-specific scalar configuration. STRUCTURAL requires `{}`.
        SEMANTIC_REFINEMENT requires exactly contextSlices, embeddingProfileId,
        mergeSimilarityThreshold and splitSimilarityThreshold. contextSlices is 0..2;
        thresholds satisfy -1 <= split < merge <= 1. Other installed adapters define
        their own server-side validated contract.
      additionalProperties:
        oneOf:
          - type: string
          - type: number
          - type: boolean
    AvailableParser:
      type: object
      description: Parser capability catalog entry; unavailable entries are visible but not selectable.
      required:
        - id
        - version
        - canonicalMediaType
        - defaultSelection
        - available
        - unavailableReason
        - mediaTypes
        - extensions
        - outputCapabilities
      properties:
        id:
          type: string
        version:
          type: string
        canonicalMediaType:
          type: string
        defaultSelection:
          type: boolean
          description: Whether this available Parser is the deployment default for its format.
        available:
          type: boolean
          description: Whether the current deployment can save and execute this Parser.
        unavailableReason:
          type: string
          nullable: true
          description: Stable reason code when the catalog entry is not installed or enabled.
        mediaTypes:
          type: array
          items:
            type: string
        extensions:
          type: array
          items:
            type: string
        outputCapabilities:
          type: array
          uniqueItems: true
          description: Guaranteed output structure and provenance capabilities; not a quality score.
          items:
            $ref: '#/components/schemas/ParserOutputCapability'
    ParserOutputCapability:
      type: string
      enum:
        - STANDARD_ELEMENTS
        - HIERARCHY
        - PAGE_NUMBER
        - BOUNDING_BOX
        - FLAT_TABLE_TEXT
        - TABLE_STRUCTURE
        - NATIVE_ARTIFACT
    AvailableChunker:
      type: object
      description: |
        Installed Chunker Provider descriptor. Registry and selection are Adapter-ready,
        but the current distribution contains no third-party implementation.
        SEMANTIC_REFINEMENT adds or removes only STRUCTURAL soft boundaries and cannot
        cross structural hard boundaries; it is not a pure-semantic mode.
      required:
        - id
        - version
        - available
        - unavailableReason
        - requiredParserCapabilities
        - defaultProviderConfig
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 64
          pattern: '^[A-Z][A-Z0-9_]{0,63}$'
          description: Stable Provider ID; not a closed enum.
        version:
          type: string
          minLength: 1
          maxLength: 128
          description: Provider implementation contract version.
        available:
          type: boolean
          description: Whether the current deployment can execute this Provider.
        unavailableReason:
          type: string
          nullable: true
          maxLength: 128
          pattern: '^[A-Z][A-Z0-9_]{0,127}$'
          description: Stable reason code when unavailable; otherwise null.
        requiredParserCapabilities:
          type: array
          minItems: 1
          uniqueItems: true
          description: |
            Capabilities every effective selected Parser must provide. The server
            rejects incompatible Parser/Chunker combinations during configuration.
          items:
            $ref: '#/components/schemas/ParserOutputCapability'
        defaultProviderConfig:
          $ref: '#/components/schemas/ChunkerProviderConfiguration'
    AvailableTokenizer:
      type: object
      required: [id, version, description, exactModelTokens, modelProfileId,
                 available, unavailableReason]
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$'
        version:
          type: string
          minLength: 1
          maxLength: 128
        description:
          type: string
        exactModelTokens:
          type: boolean
          description: |
            True only when the counter implements the exact target-model tokenizer.
            UTF8_BYTE_BUDGET is a deterministic UTF-8 byte budget proxy and returns false.
        modelProfileId:
          type: string
          nullable: true
          description: Deployment-pinned target model contract; not a credential.
        available:
          type: boolean
          description: Whether this deployment can execute the Tokenizer now.
        unavailableReason:
          type: string
          nullable: true
          description: Stable reason code when the Adapter exists but is not configured.
    AvailableEmbeddingProfile:
      type: object
      required: [id, description]
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 256
          description: Deployment-installed model/version/dimension contract; not credentials.
        description:
          type: string
    MarkdownDocumentRequest:
      type: object
      required: [spaceId, externalId, title, sourceUri, language, content]
      properties:
        spaceId:
          type: string
          minLength: 1
          maxLength: 64
        externalId:
          type: string
          minLength: 1
          maxLength: 512
        title:
          type: string
          minLength: 1
          maxLength: 512
        sourceUri:
          type: string
          minLength: 1
          maxLength: 2048
        language:
          type: string
          minLength: 1
          maxLength: 32
        authority:
          type: integer
          minimum: 0
          maximum: 100
          default: 0
        content:
          type: string
          minLength: 1
          maxLength: 2000000
        metadata:
          type: object
          maxProperties: 64
          additionalProperties:
            type: string
            minLength: 1
            maxLength: 2048
    MarkdownDocumentResponse:
      type: object
      required: [documentId, revisionId, changed, elementCount, chunkCount, vectorStatus, warnings]
      properties:
        documentId:
          type: string
          format: uuid
        revisionId:
          type: string
          format: uuid
        changed:
          type: boolean
        elementCount:
          type: integer
        chunkCount:
          type: integer
        vectorStatus:
          type: string
        warnings:
          type: array
          items:
            type: string
    IngestionManifest:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 10
          description: Must have the same size and order as the multipart files array.
          items:
            $ref: '#/components/schemas/IngestionManifestItem'
    IngestionManifestItem:
      type: object
      required: [externalId]
      properties:
        externalId:
          type: string
          minLength: 1
          maxLength: 512
          description: Stable logical source key. It never implies overwrite.
        title:
          type: string
          maxLength: 512
          description: Human-readable retrieval title; a blank value uses the safe file name.
        authority:
          type: integer
          minimum: 0
          maximum: 100
          default: 80
          description: Source quality signal, not an authorization role or ACL.
    ExtractionRunStatus:
      type: string
      enum: [QUEUED, RUNNING, CANCEL_REQUESTED, SUCCEEDED, FAILED, CANCELLED]
    ExtractionItemStatus:
      type: string
      enum: [QUEUED, RUNNING, SUCCEEDED, SKIPPED_DUPLICATE, FAILED, CANCELLED]
    ExtractionItemStage:
      type: string
      description: 粗粒度阶段归因；当前 RUNNING/PARSE 表示已开始抽取，不是逐阶段实时进度。
      enum: [STORED, PARSE, CLEAN, CHUNK, PUBLISHING, COMPLETED]
    ExtractionGateStatus:
      type: string
      description: Gate 与 Run 状态彼此独立；未执行真实 Dataset 评测时必须是 NOT_EVALUATED。
      enum: [NOT_EVALUATED, PASSED, FAILED, ERROR]
    ExtractionRunSummary:
      type: object
      required: [id, spaceId, mode, status, errorCode, configVersion,
                 configFingerprint, datasetId, baselineRunId, gateStatus,
                 totalItems, succeededItems, skippedDuplicateItems, failedItems,
                 createdAt, startedAt, finishedAt, heartbeatAt]
      properties:
        id:
          type: string
          format: uuid
        spaceId:
          type: string
        mode:
          type: string
          description: TEST_ONLY 不发布正式数据；INGEST 使用相同任务模型并可输出 Document/Revision。
          enum: [TEST_ONLY, INGEST]
        status:
          $ref: '#/components/schemas/ExtractionRunStatus'
        errorCode:
          type: string
          nullable: true
        configVersion:
          type: integer
          format: int64
          description: |
            Space 创建时固化的配置版本，仅用于审计和 INGEST 防御性写栅栏，不参与
            有效配置指纹；TEST_ONLY 使用本次测试配置时仍记录 Space 的固化版本。
        configFingerprint:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: 仅由规范化有效配置与处理合同计算。
        datasetId:
          type: string
          nullable: true
        baselineRunId:
          type: string
          format: uuid
          nullable: true
          description: |
            创建本次测试 Run 时已经是 TEST_ONLY、SUCCEEDED 且 Gate 为 PASSED 或 FAILED
            的可评测 Run；必须属于同 tenant/space、同不可变 Dataset 与相同规范化语言。
        gateStatus:
          $ref: '#/components/schemas/ExtractionGateStatus'
        totalItems:
          type: integer
        succeededItems:
          type: integer
          format: int64
        skippedDuplicateItems:
          type: integer
          format: int64
          description: INGEST 无覆盖语义下按相同内容短路的成功类终态数量。
        failedItems:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
        startedAt:
          type: string
          format: date-time
          nullable: true
        finishedAt:
          type: string
          format: date-time
          nullable: true
        heartbeatAt:
          type: string
          format: date-time
          nullable: true
    ExtractionRunDetail:
      allOf:
        - $ref: '#/components/schemas/ExtractionRunSummary'
        - type: object
          required: [configSnapshot, gateReport, items]
          properties:
            configSnapshot:
              $ref: '#/components/schemas/ExtractionConfigSnapshot'
            gateReport:
              nullable: true
              allOf:
                - $ref: '#/components/schemas/ExtractionGateReport'
            items:
              type: array
              items:
                $ref: '#/components/schemas/ExtractionRunItem'
    ExtractionRunItem:
      type: object
      required: [id, sourceAssetId, fileName, mediaType, contentLength,
                 checksumSha256, externalId, title, authority, status, stage,
                 errorCode, diagnostics, preview, documentId, revisionId]
      properties:
        id:
          type: string
          format: uuid
        sourceAssetId:
          type: string
          format: uuid
        fileName:
          type: string
        mediaType:
          type: string
        contentLength:
          type: integer
          format: int64
        checksumSha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
        externalId:
          type: string
          nullable: true
          description: INGEST 创建时固化的稳定来源标识；TEST_ONLY 为 null。
        title:
          type: string
          nullable: true
          description: INGEST 创建时固化并参与检索的标题；TEST_ONLY 为 null。
        authority:
          type: integer
          minimum: 0
          maximum: 100
          nullable: true
          description: INGEST 创建时固化的来源质量信号，不是 ACL；TEST_ONLY 为 null。
        status:
          $ref: '#/components/schemas/ExtractionItemStatus'
        stage:
          $ref: '#/components/schemas/ExtractionItemStage'
        errorCode:
          type: string
          nullable: true
        diagnostics:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/ExtractionItemDiagnostics'
        preview:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/ExtractionPreview'
        documentId:
          type: string
          format: uuid
          nullable: true
          description: INGEST 成功发布或重复短路时的正式 Document；TEST_ONLY 必须为 null。
        revisionId:
          type: string
          format: uuid
          nullable: true
          description: 与 documentId 成对出现；TEST_ONLY 必须为 null。
    ExtractionConfigSnapshot:
      type: object
      description: 创建任务时固化的完整有效处理配置，可无损恢复执行配置。
      required: [processingContract, normalizerContract, parserSelections, cleaning,
                 chunker, fingerprint]
      properties:
        processingContract:
          $ref: '#/components/schemas/DocumentProcessingContract'
        normalizerContract:
          type: string
          minLength: 1
          description: 本次输入字节规范化实现；多文件为 identity-bytes-v1。
        parserSelections:
          type: object
          additionalProperties:
            type: string
        cleaning:
          $ref: '#/components/schemas/ExtractionConfigCleaning'
        chunker:
          $ref: '#/components/schemas/ExtractionConfigChunker'
        fingerprint:
          type: string
          pattern: '^[0-9a-f]{64}$'
    ExtractionConfigCleaning:
      type: object
      required: [header, footer, pageNumber, watermark, frontMatter]
      properties:
        header:
          type: string
        footer:
          type: string
        pageNumber:
          type: string
        watermark:
          type: string
        frontMatter:
          type: string
    ExtractionConfigChunker:
      type: object
      required: [providerId, tokenizerId, minimumTokens, targetTokens,
                 maximumTokens, overlapTokens, providerConfigurationJson]
      properties:
        providerId:
          type: string
        tokenizerId:
          type: string
        minimumTokens:
          type: integer
          minimum: 1
        targetTokens:
          type: integer
          minimum: 1
        maximumTokens:
          type: integer
          minimum: 1
        overlapTokens:
          type: integer
          minimum: 0
        providerConfigurationJson:
          type: string
          description: 已规范化、可复现的 provider 配置 JSON。
    ExtractionPreview:
      type: object
      description: 有界持久化预览；不包含完整原件、contextualText、Token 或模型原始响应。
      required: [artifactId, artifactLength, totalElementCount, totalChunkCount,
                 truncated, elements, chunks]
      properties:
        artifactId:
          type: string
          format: uuid
        artifactLength:
          type: integer
          minimum: 0
        totalElementCount:
          type: integer
          minimum: 0
        totalChunkCount:
          type: integer
          minimum: 0
        truncated:
          type: boolean
        elements:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/ExtractionPreviewElement'
        chunks:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/ExtractionPreviewChunk'
    ExtractionPreviewElement:
      type: object
      required: [id, parentId, type, ordinal, sectionPath, role,
                 cleaningAction, cleaningReasonCode, sourceRange,
                 contentLength, text, textTruncated]
      properties:
        id:
          type: string
          format: uuid
        parentId:
          type: string
          format: uuid
          nullable: true
        type:
          type: string
        ordinal:
          type: integer
          minimum: 0
        sectionPath:
          type: array
          items:
            type: string
        role:
          type: string
          nullable: true
        cleaningAction:
          type: string
        cleaningReasonCode:
          type: string
        sourceRange:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/ExtractionArtifactRange'
        contentLength:
          type: integer
