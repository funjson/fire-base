          minimum: 0
        semanticNeutralSuggestions:
          type: integer
          minimum: 0
        semanticCutsAdded:
          type: integer
          minimum: 0
        semanticJoinsApplied:
          type: integer
          minimum: 0
        semanticNoOps:
          type: integer
          minimum: 0
        tokenLimitBreaks:
          type: integer
          minimum: 0
        spanLimitBreaks:
          type: integer
          minimum: 0
        rejectedSemanticJoins:
          type: integer
          minimum: 0
        finalChunkCount:
          type: integer
          minimum: 0
        minimumChunkUnits:
          type: integer
          minimum: 0
        averageChunkUnits:
          type: number
          format: double
          minimum: 0
        maximumChunkUnits:
          type: integer
          minimum: 0
    SourceObjectResponse:
