          format: double
          minimum: 0
          maximum: 100
    RetrievalChannelOverrides:
      type: object
      additionalProperties: false
      properties:
        KEYWORD:
          $ref: '#/components/schemas/RetrievalBranchOverride'
        VECTOR:
          $ref: '#/components/schemas/RetrievalBranchOverride'
        GRAPH:
          $ref: '#/components/schemas/RetrievalBranchOverride'
        PAGE:
          $ref: '#/components/schemas/RetrievalBranchOverride'
    RetrievalBranchesOverride:
      type: object
      additionalProperties: false
      properties:
        maximumVariantsPerAttempt:
          type: integer
          minimum: 1
          maximum: 16
        maximumRetrievalBranches:
          type: integer
          minimum: 1
          maximum: 64
        rrfConstant:
          type: integer
          minimum: 1
          maximum: 10000
        channels:
          $ref: '#/components/schemas/RetrievalChannelOverrides'
    RetrievalRerankerOverride:
      type: object
      additionalProperties: false
      properties:
        enabled: {type: boolean}
        providerId: {type: string, maxLength: 64}
        modelId: {type: string, maxLength: 128}
        candidateLimit:
          type: integer
          minimum: 1
          maximum: 1000
        outputTopK:
          type: integer
          minimum: 1
          maximum: 1000
    RetrievalCoverageOverride:
      type: object
      additionalProperties: false
      properties:
        enabled: {type: boolean}
        providerId: {type: string, maxLength: 64}
        modelId: {type: string, maxLength: 128}
        promptVersion: {type: string, maxLength: 128}
        memoryLimit:
          type: integer
          minimum: 1
          maximum: 100
        sufficiencyThreshold:
          type: number
          format: double
          minimum: 0
          maximum: 1
    RetrievalChainNodeOverrides:
      type: object
      additionalProperties: false
      properties:
        GAP_QUERY: {type: boolean}
        PRF: {type: boolean}
        RELAX_CONSTRAINTS: {type: boolean}
        NARROW_CONSTRAINTS: {type: boolean}
        STEP_BACK: {type: boolean}
        HYDE: {type: boolean}
        NEXT_SPACE: {type: boolean}
    RetrievalCrossSpaceOverride:
      type: object
      additionalProperties: false
      properties:
        enabled: {type: boolean}
        maximumSpaces:
          type: integer
          minimum: 1
          maximum: 16
    RetrievalConfigurationOverride:
      type: object
      additionalProperties: false
      properties:
        firstRound:
          $ref: '#/components/schemas/RetrievalFirstRoundOverride'
        branches:
          $ref: '#/components/schemas/RetrievalBranchesOverride'
        reranker:
          $ref: '#/components/schemas/RetrievalRerankerOverride'
        coverage:
          $ref: '#/components/schemas/RetrievalCoverageOverride'
        maximumRetrievalAttempts:
          type: integer
          minimum: 1
          maximum: 16
        chainNodeEnables:
          $ref: '#/components/schemas/RetrievalChainNodeOverrides'
        crossSpace:
          $ref: '#/components/schemas/RetrievalCrossSpaceOverride'
    EvidenceRequirement:
      type: object
      additionalProperties: false
      required: [id, description]
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 64
          pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$'
        description:
          type: string
          minLength: 1
          maxLength: 2000
    RetrievalConstraints:
      type: object
      additionalProperties: false
      properties:
        relaxableFilters:
          type: object
          default: {}
          additionalProperties:
            type: string
            minLength: 1
            maxLength: 128
          description: Initial filters that the caller explicitly allows RELAX_CONSTRAINTS to remove. Only `language` and `sourceType` are accepted.
        narrowingFilters:
          type: object
          default: {}
          additionalProperties:
            type: string
            minLength: 1
            maxLength: 128
          description: Caller-provided filters that are inactive initially and may be applied by NARROW_CONSTRAINTS. Only `language` and `sourceType` are accepted.
    KnowledgeQueryRequest:
      type: object
      additionalProperties: false
      required: [query]
      properties:
        query:
          type: string
          minLength: 1
          maxLength: 16000
        spaceIds:
          type: array
          uniqueItems: true
          default: []
          items:
            type: string
            minLength: 1
            maxLength: 64
        topK:
          type: integer
          minimum: 1
          maximum: 100
        filters:
          type: object
          default: {}
          additionalProperties:
            type: string
            minLength: 1
            maxLength: 128
          description: Hard filters that are always applied and can never be relaxed. Only `language` and `sourceType` keys are accepted.
        constraints:
          allOf:
            - $ref: '#/components/schemas/RetrievalConstraints'
          default: {}
          description: Explicitly mutable logical filters. Keys must not overlap with hard filters or each other.
        retrievalTarget:
          type: string
          maxLength: 4000
          default: ''
        evidenceRequirements:
          type: array
          maxItems: 32
          default: []
          items:
            $ref: '#/components/schemas/EvidenceRequirement'
        configurationOverride:
          allOf:
            - $ref: '#/components/schemas/RetrievalConfigurationOverride'
          default: {}
          description: Typed per-request partial override; omitted fields inherit the Space revision.
        testMode:
          type: boolean
          default: false
          description: Uses TEST_PLAZA observation purpose without bypassing the production path.
    KnowledgeQueryResponse:
      type: object
      required: [requestId, traceId, tenantId, evidences, sufficient, terminalStatus,
                 stopReason, degraded, visitedSpaceIds, configurationFingerprints,
                 warnings, generatedAt]
      properties:
        requestId:
          type: string
          format: uuid
        traceId:
          type: string
          format: uuid
        tenantId:
          type: string
        evidences:
          type: array
          items:
            $ref: '#/components/schemas/KnowledgeEvidence'
        sufficient:
          type: boolean
        terminalStatus:
          type: string
          enum: [SUFFICIENT, INSUFFICIENT, NOT_EVALUATED, EVIDENCE_REQUIREMENTS_MISSING, CHECK_FAILED, TECHNICAL_FAILED]
        stopReason:
          type: string
          enum: [SUFFICIENCY_THRESHOLD_REACHED, COVERAGE_DISABLED, EVIDENCE_REQUIREMENTS_MISSING,
                 COVERAGE_CHECK_FAILED, RETRIEVAL_BUDGET_EXHAUSTED, OPTIMIZATION_CHAIN_EXHAUSTED,
                 NO_APPLICABLE_OPTIMIZATION_NODE, TECHNICAL_FAILURE]
        degraded:
          type: boolean
        visitedSpaceIds:
          type: array
          description: Space visit order selected by routing and fixed NEXT_SPACE progression.
          items:
            type: string
        configurationFingerprints:
          type: array
          description: Effective configuration fingerprint for each visited Space in visit order.
          items:
            type: string
            pattern: '^[0-9a-f]{64}$'
        warnings:
          type: array
          items:
            type: string
        generatedAt:
          type: string
          format: date-time
    KnowledgeEvidence:
      type: object
      required: [id, content, relevance, authority, channels, citation]
      properties:
        id:
          type: string
          format: uuid
        content:
          type: string
        relevance:
          type: number
          format: double
          description: Final score for this query. It is a model score after successful reranking, otherwise the fused score.
        authority:
          type: integer
        channels:
          type: array
          items:
            type: string
            enum: [KEYWORD, VECTOR, GRAPH, PAGE]
        citation:
          $ref: '#/components/schemas/KnowledgeCitation'
    KnowledgeCitation:
      type: object
      required: [documentId, revisionId, chunkId, title, sectionPath, sourceUri, sourceSpans]
      properties:
        documentId:
          type: string
        revisionId:
          type: string
          format: uuid
        chunkId:
          type: string
          format: uuid
        title:
          type: string
        sectionPath:
          type: array
          items:
            type: string
        sourceUri:
          type: string
        sourceSpans:
          type: array
          description: Element-relative UTF-16 ranges. Historical rows may return an empty array.
          items:
            $ref: '#/components/schemas/KnowledgeSourceSpan'
    KnowledgeSourceSpan:
      type: object
      required: [elementId, startOffset, endOffset]
      properties:
        elementId:
          type: string
          format: uuid
        startOffset:
          type: integer
          minimum: 0
          description: Inclusive UTF-16 offset in the source element text.
        endOffset:
          type: integer
          minimum: 1
          description: Exclusive UTF-16 offset in the source element text.
        pageNumber:
          type: integer
          minimum: 1
          nullable: true
          description: One-based page number when the parser can provide it; bounding boxes are not implemented.
    RetrievalObservationPurpose:
      type: string
      enum: [ONLINE, EVALUATION, TEST_PLAZA, SHADOW, REPLAY]
    RetrievalObservationCompleteness:
      type: string
      enum: [COMPLETE, INCOMPLETE]
    RetrievalObservationIncompleteReason:
      type: string
      enum: [STARTED_MISSING, TERMINAL_MISSING, SEQUENCE_GAP]
    RetrievalObservationStage:
      type: string
      enum: [EXECUTION_STARTED, SPACE_ROUTING, CONFIGURATION_RESOLVED, QUERY_ANALYSIS,
             QUERY_PLANNING, RETRIEVAL_PLAN, RETRIEVAL_BRANCH, FUSION, RERANK,
             COVERAGE_CHECK, CHAIN_NODE_EVALUATED, CHAIN_NODE_COMPLETED,
             SPACE_CHANGED, EVIDENCE_BUILD, EXECUTION_TERMINAL, STAGE_FAILURE]
    RetrievalObservationStatus:
      type: string
      enum: [STARTED, SUCCEEDED, DEGRADED, SKIPPED, FAILED, TIMED_OUT,
             CANCELLED, REJECTED, NOT_CONFIGURED]
    RetrievalVisitedConfiguration:
      type: object
      required: [visitIndex, spaceId, sourceRevision, fingerprint]
      properties:
        visitIndex:
          type: integer
          minimum: 0
        spaceId:
          type: string
          minLength: 1
          maxLength: 64
        sourceRevision:
          type: integer
          format: int64
          minimum: 1
        fingerprint:
          type: string
          pattern: '^[0-9a-f]{64}$'
    RetrievalObservationEvent:
      type: object
      description: Safe stage fact; raw typed event payload is intentionally excluded.
      required: [eventId, sequence, spaceIds, visitIndex, attemptIndex, stage, status,
                 reasonCode, configFingerprint, startedAt, completedAt, durationMillis,
                 inputCount, outputCount, schemaVersion]
      properties:
        eventId:
          type: string
          format: uuid
        sequence:
          type: integer
          format: int64
          minimum: 0
        spaceIds:
          type: array
          uniqueItems: true
          items:
            type: string
        visitIndex:
          type: integer
          minimum: 0
        attemptIndex:
          type: integer
          minimum: 0
        stage:
          $ref: '#/components/schemas/RetrievalObservationStage'
        status:
          $ref: '#/components/schemas/RetrievalObservationStatus'
        reasonCode:
          type: string
          maxLength: 64
        configFingerprint:
          type: string
          pattern: '^(UNRESOLVED|[0-9a-f]{64})$'
        startedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
        durationMillis:
          type: integer
          format: int64
          minimum: 0
        inputCount:
          type: integer
          minimum: 0
        outputCount:
          type: integer
          minimum: 0
        schemaVersion:
          type: integer
          minimum: 1
    RetrievalMetricDimensions:
      type: object
      additionalProperties: false
      required: [space, queryCase, config, strategy, attempt, componentModel,
                 dataIndexVersion, status, stopReason, purpose, timeSlice]
      properties:
        space:
          type: string
          nullable: true
        queryCase:
          type: string
          format: uuid
          nullable: true
          description: Present only for Gold-bound offline facts, never runtime facts.
        config:
          type: string
          pattern: '^(UNRESOLVED|[0-9a-f]{64})$'
        strategy:
          type: string
          nullable: true
        attempt:
          type: string
          nullable: true
          pattern: '^[0-9]+$'
        componentModel:
          type: string
          nullable: true
        dataIndexVersion:
          type: string
          nullable: true
        status:
          type: string
        stopReason:
          type: string
          nullable: true
        purpose:
          $ref: '#/components/schemas/RetrievalObservationPurpose'
        timeSlice:
          type: string
          description: Explicit granularity and aligned UTC instant, for example HOUR:2026-08-26T08:00:00Z.
    RetrievalMetricGoldReference:
      type: object
      required: [datasetId, datasetVersion, caseId]
      properties:
        datasetId:
          type: string
          format: uuid
        datasetVersion:
          type: integer
          format: int64
          minimum: 1
        caseId:
          type: string
          format: uuid
    RetrievalMetric:
      type: object
      required: [sourceEventId, type, metricKey, metricDefinitionVersion,
                 aggregation, value, dimensions, observedAt, goldReference]
      properties:
        sourceEventId:
          type: string
          format: uuid
        type:
          type: string
          enum: [RUNTIME, OFFLINE_GOLD]
        metricKey:
          type: string
          pattern: '^[a-z][a-z0-9_.-]{0,127}$'
        metricDefinitionVersion:
          type: integer
          minimum: 1
        aggregation:
          type: string
          enum: [COUNT, SUM, DISTRIBUTION, MACRO_AVERAGE, RATIO_NUMERATOR, RATIO_DENOMINATOR]
        value:
          type: number
          format: double
        dimensions:
          $ref: '#/components/schemas/RetrievalMetricDimensions'
        observedAt:
          type: string
          format: date-time
        goldReference:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/RetrievalMetricGoldReference'
    RetrievalObservationReport:
      type: object
      required: [requestId, executionId, purpose, completeness, incompleteReasons,
                 missingSequences, spaceIds, visitedConfigurations, eventCount, events, metrics]
      properties:
        requestId:
          type: string
          format: uuid
        executionId:
          type: string
          format: uuid
        purpose:
          $ref: '#/components/schemas/RetrievalObservationPurpose'
        completeness:
          $ref: '#/components/schemas/RetrievalObservationCompleteness'
        incompleteReasons:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/RetrievalObservationIncompleteReason'
        missingSequences:
          type: array
          uniqueItems: true
          items:
            type: integer
            format: int64
            minimum: 0
        spaceIds:
          type: array
          uniqueItems: true
          items:
            type: string
        visitedConfigurations:
          type: array
          description: Ordered by visitIndex and identifies the actual Space revision and effective fingerprint.
          items:
            $ref: '#/components/schemas/RetrievalVisitedConfiguration'
        eventCount:
          type: integer
          minimum: 1
        events:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/RetrievalObservationEvent'
        metrics:
          type: array
          items:
            $ref: '#/components/schemas/RetrievalMetric'
