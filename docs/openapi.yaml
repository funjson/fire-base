          maxLength: 64
        revision:
          type: integer
          format: int64
          minimum: 1
        fingerprint:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: Stable SHA-256 derived only from effective retrieval semantics.
        configuration:
          $ref: '#/components/schemas/RetrievalConfiguration'
        createdBy:
          type: string
        createdAt:
          type: string
          format: date-time
    UpdateSpaceRetrievalConfigurationRequest:
      type: object
