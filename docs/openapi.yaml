        chainNodeEnables:
          $ref: '#/components/schemas/RetrievalChainNodeEnables'
        crossSpace:
          $ref: '#/components/schemas/RetrievalCrossSpaceConfiguration'
    SpaceRetrievalConfiguration:
      type: object
