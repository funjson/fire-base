      responses:
        '200':
          description: Retrieval traces
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Trace'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/admin/traces/{traceId}:
    parameters:
      - $ref: '#/components/parameters/TraceId'
    get:
      tags: [Traces]
