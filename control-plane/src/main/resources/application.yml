server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

logging:
  pattern:
    level: "%5p [request_id:%X{request_id:-}]"

spring:
  application:
    name: infinity-knowledge
  task:
    scheduling:
      pool:
        size: ${KNOWLEDGE_SCHEDULER_POOL_SIZE:3}
      thread-name-prefix: knowledge-scheduler-
      shutdown:
        await-termination: true
        await-termination-period: 30s
  servlet:
    multipart:
      max-file-size: 25MB
      # 业务正文总量仍由 extraction-runs.maximum-total-bytes 限制为 250MiB；
      # 这里额外预留 Multipart 边界与请求头开销。
      max-request-size: 251MB
      file-size-threshold: 0
  datasource:
    url: ${KNOWLEDGE_DB_URL:jdbc:postgresql://localhost:5433/infinity_knowledge}
    username: ${KNOWLEDGE_DB_USERNAME:infinity_knowledge}
    password: ${KNOWLEDGE_DB_PASSWORD:infinity_knowledge}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 1
      connection-timeout: 5000
  flyway:
    enabled: true
    locations: classpath:db/migration
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER_URI:http://localhost:8180/realms/infinity-knowledge}
          audiences:
            - ${OIDC_AUDIENCE:infinity-knowledge-api}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

infinity:
  knowledge:
    security:
      trusted-system-clients: ${KNOWLEDGE_TRUSTED_SYSTEM_CLIENTS:}
    web:
      allowed-origins: ${KNOWLEDGE_WEB_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
    model-tokenizers:
      zhipu:
        # 仅用于 GLM 在线 Prompt 预算；没有 offset，禁止用作 Chunk 硬切 Tokenizer。
        enabled: ${KNOWLEDGE_ZHIPU_TOKENIZER_ENABLED:false}
        endpoint: ${KNOWLEDGE_ZHIPU_TOKENIZER_ENDPOINT:https://open.bigmodel.cn/api/paas/v4/tokenizer}
        api-key: ${ZHIPU_API_KEY:}
        request-timeout: ${KNOWLEDGE_ZHIPU_TOKENIZER_REQUEST_TIMEOUT:1s}
        max-attempts: ${KNOWLEDGE_ZHIPU_TOKENIZER_MAX_ATTEMPTS:1}
        initial-backoff: ${KNOWLEDGE_ZHIPU_TOKENIZER_INITIAL_BACKOFF:0s}
        maximum-input-characters: ${KNOWLEDGE_ZHIPU_TOKENIZER_MAXIMUM_INPUT_CHARACTERS:500000}
        proxy-host: ${KNOWLEDGE_ZHIPU_TOKENIZER_PROXY_HOST:}
        proxy-port: ${KNOWLEDGE_ZHIPU_TOKENIZER_PROXY_PORT:0}
    retrieval:
      mode: standard
      observation:
        # 本地开发默认值只为开箱运行；生产环境必须由秘密管理系统覆盖并按版本轮换。
        secret: ${KNOWLEDGE_RETRIEVAL_FINGERPRINT_SECRET:local-development-observation-key-change-before-production}
        key-version: ${KNOWLEDGE_RETRIEVAL_FINGERPRINT_KEY_VERSION:local-v1}
      candidate-multiplier: 5
      rrf-constant: 60
      sufficient-threshold: 0.5
      parallelism: 4
      queue-capacity: 256
      request-timeout: 35s
      channel-timeout: 30s
      space-router:
        enabled: ${KNOWLEDGE_SPACE_ROUTER_ENABLED:false}
        stage-timeout: ${KNOWLEDGE_SPACE_ROUTER_STAGE_TIMEOUT:6s}
        endpoint: ${KNOWLEDGE_SPACE_ROUTER_ENDPOINT:https://open.bigmodel.cn/api/paas/v4/chat/completions}
        api-key: ${ZHIPU_API_KEY:}
        model: ${KNOWLEDGE_SPACE_ROUTER_MODEL:glm-5.2}
        request-timeout: ${KNOWLEDGE_SPACE_ROUTER_REQUEST_TIMEOUT:3s}
        max-attempts: ${KNOWLEDGE_SPACE_ROUTER_MAX_ATTEMPTS:1}
        initial-backoff: ${KNOWLEDGE_SPACE_ROUTER_INITIAL_BACKOFF:0s}
        max-input-characters: ${KNOWLEDGE_SPACE_ROUTER_MAX_INPUT_CHARACTERS:32000}
        maximum-prompt-tokens: ${KNOWLEDGE_SPACE_ROUTER_MAXIMUM_PROMPT_TOKENS:8192}
        max-output-tokens: ${KNOWLEDGE_SPACE_ROUTER_MAX_OUTPUT_TOKENS:512}
        proxy-host: ${KNOWLEDGE_SPACE_ROUTER_PROXY_HOST:}
        proxy-port: ${KNOWLEDGE_SPACE_ROUTER_PROXY_PORT:0}
      feedback-planner:
        enabled: ${KNOWLEDGE_FEEDBACK_PLANNER_ENABLED:false}
        stage-timeout: ${KNOWLEDGE_FEEDBACK_PLANNER_STAGE_TIMEOUT:6s}
        endpoint: ${KNOWLEDGE_FEEDBACK_PLANNER_ENDPOINT:https://open.bigmodel.cn/api/paas/v4/chat/completions}
        api-key: ${ZHIPU_API_KEY:}
        model: ${KNOWLEDGE_FEEDBACK_PLANNER_MODEL:glm-5.2}
        request-timeout: ${KNOWLEDGE_FEEDBACK_PLANNER_REQUEST_TIMEOUT:3s}
        max-attempts: ${KNOWLEDGE_FEEDBACK_PLANNER_MAX_ATTEMPTS:1}
        initial-backoff: ${KNOWLEDGE_FEEDBACK_PLANNER_INITIAL_BACKOFF:0s}
        max-input-characters: ${KNOWLEDGE_FEEDBACK_PLANNER_MAX_INPUT_CHARACTERS:24000}
        maximum-prompt-tokens: ${KNOWLEDGE_FEEDBACK_PLANNER_MAXIMUM_PROMPT_TOKENS:16384}
        max-output-tokens: ${KNOWLEDGE_FEEDBACK_PLANNER_MAX_OUTPUT_TOKENS:512}
        proxy-host: ${KNOWLEDGE_FEEDBACK_PLANNER_PROXY_HOST:}
        proxy-port: ${KNOWLEDGE_FEEDBACK_PLANNER_PROXY_PORT:0}
      coverage-judge:
        enabled: ${KNOWLEDGE_COVERAGE_JUDGE_ENABLED:false}
        stage-timeout: ${KNOWLEDGE_COVERAGE_JUDGE_STAGE_TIMEOUT:10s}
        endpoint: ${KNOWLEDGE_COVERAGE_JUDGE_ENDPOINT:https://open.bigmodel.cn/api/paas/v4/chat/completions}
        api-key: ${ZHIPU_API_KEY:}
        model: ${KNOWLEDGE_COVERAGE_JUDGE_MODEL:glm-5.2}
        request-timeout: ${KNOWLEDGE_COVERAGE_JUDGE_REQUEST_TIMEOUT:6s}
        max-attempts: ${KNOWLEDGE_COVERAGE_JUDGE_MAX_ATTEMPTS:1}
        initial-backoff: ${KNOWLEDGE_COVERAGE_JUDGE_INITIAL_BACKOFF:0s}
        max-input-characters: ${KNOWLEDGE_COVERAGE_JUDGE_MAX_INPUT_CHARACTERS:120000}
        maximum-prompt-tokens: ${KNOWLEDGE_COVERAGE_JUDGE_MAXIMUM_PROMPT_TOKENS:65536}
        max-output-tokens: ${KNOWLEDGE_COVERAGE_JUDGE_MAX_OUTPUT_TOKENS:2048}
        proxy-host: ${KNOWLEDGE_COVERAGE_JUDGE_PROXY_HOST:}
        proxy-port: ${KNOWLEDGE_COVERAGE_JUDGE_PROXY_PORT:0}
      reranker:
        enabled: ${KNOWLEDGE_RERANKER_ENABLED:false}
        provider: ${KNOWLEDGE_RERANKER_PROVIDER:embedding}
        stage-timeout: ${KNOWLEDGE_RERANKER_STAGE_TIMEOUT:4s}
        max-candidates: 24
        max-query-characters: 4096
        max-candidate-characters: 4096
        max-total-characters: 100000
        zhipu:
          endpoint: ${KNOWLEDGE_RERANKER_ENDPOINT:https://open.bigmodel.cn/api/paas/v4/rerank}
          api-key: ${ZHIPU_API_KEY:}
          model: ${KNOWLEDGE_RERANKER_MODEL:rerank}
          request-timeout: ${KNOWLEDGE_RERANKER_REQUEST_TIMEOUT:3s}
          max-attempts: ${KNOWLEDGE_RERANKER_MAX_ATTEMPTS:1}
          initial-backoff: ${KNOWLEDGE_RERANKER_INITIAL_BACKOFF:0s}
          proxy-host: ${KNOWLEDGE_RERANKER_PROXY_HOST:}
          proxy-port: ${KNOWLEDGE_RERANKER_PROXY_PORT:0}
    ingestion:
      tokenizer-id: ${KNOWLEDGE_CHUNK_TOKENIZER_ID:UTF8_BYTE_BUDGET}
      minimum-chunk-tokens: ${KNOWLEDGE_CHUNK_MINIMUM_TOKENS:128}
      target-chunk-tokens: ${KNOWLEDGE_CHUNK_TARGET_TOKENS:512}
      maximum-chunk-tokens: ${KNOWLEDGE_CHUNK_MAXIMUM_TOKENS:1024}
      overlap-chunk-tokens: ${KNOWLEDGE_CHUNK_OVERLAP_TOKENS:32}
      allowed-source-schemes: ${KNOWLEDGE_ALLOWED_SOURCE_SCHEMES:http,https,obsidian}
      semantic-chunking:
        enabled: ${KNOWLEDGE_SEMANTIC_CHUNKING_ENABLED:false}
        maximum-embedding-inputs: 128
        maximum-input-characters: 16000
        maximum-candidates: 127
        maximum-vector-values: 262144
        stage-timeout: 12s
      parsers:
        docling:
          enabled: ${KNOWLEDGE_DOCLING_PARSER_ENABLED:false}
          # DOCX 必须单独通过固定部署 Golden；默认关闭时保留内置 POI Parser。
          docx-enabled: ${KNOWLEDGE_DOCLING_DOCX_PARSER_ENABLED:false}
          endpoint: ${KNOWLEDGE_DOCLING_ENDPOINT:http://localhost:5001}
          api-key: ${KNOWLEDGE_DOCLING_API_KEY:}
          # 固定 Docling Serve 镜像与模型包；升级会形成新的 parserVersion。
          deployment-contract: ${KNOWLEDGE_DOCLING_DEPLOYMENT_CONTRACT:}
          # 与 Docling Serve 返回的 schema_name/version 一致；升级时必须显式修改并重处理。
          server-contract: ${KNOWLEDGE_DOCLING_SERVER_CONTRACT:}
          connect-timeout: ${KNOWLEDGE_DOCLING_CONNECT_TIMEOUT:10s}
          document-timeout: ${KNOWLEDGE_DOCLING_DOCUMENT_TIMEOUT:2m}
          read-timeout: ${KNOWLEDGE_DOCLING_READ_TIMEOUT:130s}
          maximum-concurrent-requests: ${KNOWLEDGE_DOCLING_MAXIMUM_CONCURRENT_REQUESTS:2}
      tokenizers:
        huggingface:
          enabled: ${KNOWLEDGE_HUGGINGFACE_TOKENIZER_ENABLED:false}
          id: ${KNOWLEDGE_HUGGINGFACE_TOKENIZER_ID:HUGGINGFACE_LOCAL}
          model-profile-id: ${KNOWLEDGE_HUGGINGFACE_MODEL_PROFILE_ID:}
          tokenizer-json: ${KNOWLEDGE_HUGGINGFACE_TOKENIZER_JSON:}
          sha256: ${KNOWLEDGE_HUGGINGFACE_TOKENIZER_SHA256:}
          add-special-tokens: ${KNOWLEDGE_HUGGINGFACE_ADD_SPECIAL_TOKENS:true}
      files:
        maximum-source-bytes: 26214400
        maximum-expanded-bytes: 104857600
        maximum-pages: 500
        maximum-elements: 20000
        maximum-text-characters: 10000000
        maximum-archive-entries: 10000
        maximum-compression-ratio: 100
      extraction-runs:
        maximum-files: ${KNOWLEDGE_EXTRACTION_MAXIMUM_FILES:10}
        maximum-total-bytes: ${KNOWLEDGE_EXTRACTION_MAXIMUM_TOTAL_BYTES:262144000}
        list-limit: ${KNOWLEDGE_EXTRACTION_LIST_LIMIT:50}
        stale-after: ${KNOWLEDGE_EXTRACTION_STALE_AFTER:15m}
        receiving-timeout: ${KNOWLEDGE_EXTRACTION_RECEIVING_TIMEOUT:30m}
        poll-interval: ${KNOWLEDGE_EXTRACTION_POLL_INTERVAL:1s}
    object-storage:
      minio:
        endpoint: ${KNOWLEDGE_MINIO_ENDPOINT:http://localhost:9002}
        access-key: ${KNOWLEDGE_MINIO_ACCESS_KEY:minioadmin}
        secret-key: ${KNOWLEDGE_MINIO_SECRET_KEY:minioadmin}
        bucket: ${KNOWLEDGE_MINIO_BUCKET:infinity-knowledge-source}
        maximum-object-bytes: 26214400
        create-bucket: ${KNOWLEDGE_MINIO_CREATE_BUCKET:true}
    wiki:
      generative-enabled: ${KNOWLEDGE_WIKI_GENERATIVE_ENABLED:false}
      endpoint: ${KNOWLEDGE_WIKI_ENDPOINT:https://open.bigmodel.cn/api/paas/v4/chat/completions}
      api-key: ${ZHIPU_API_KEY:}
      model: ${KNOWLEDGE_WIKI_MODEL:glm-4-flash}
      request-timeout: 60s
      max-attempts: 2
      initial-backoff: 300ms
      max-input-characters: 120000
      max-output-tokens: 4096
      minimum-source-coverage: 0.5
      proxy-host: ${KNOWLEDGE_WIKI_PROXY_HOST:}
      proxy-port: ${KNOWLEDGE_WIKI_PROXY_PORT:0}
    graph:
      neo4j:
        enabled: ${KNOWLEDGE_NEO4J_ENABLED:false}
        uri: ${KNOWLEDGE_NEO4J_URI:bolt://localhost:7687}
        username: ${KNOWLEDGE_NEO4J_USERNAME:neo4j}
        password: ${KNOWLEDGE_NEO4J_PASSWORD:}
        database: ${KNOWLEDGE_NEO4J_DATABASE:neo4j}
        max-hops: 2
        max-results: 50
        extraction-endpoint: ${KNOWLEDGE_GRAPH_ENDPOINT:https://open.bigmodel.cn/api/paas/v4/chat/completions}
        extraction-api-key: ${ZHIPU_API_KEY:}
        extraction-model: ${KNOWLEDGE_GRAPH_MODEL:glm-4.5-flash}
        extraction-timeout: 90s
        extraction-max-attempts: 2
        extraction-initial-backoff: 300ms
        extraction-max-input-characters: 120000
        extraction-max-output-tokens: 8192
        proxy-host: ${KNOWLEDGE_GRAPH_PROXY_HOST:}
        proxy-port: ${KNOWLEDGE_GRAPH_PROXY_PORT:0}
    connectors:
      obsidian:
        allowed-roots: ${KNOWLEDGE_OBSIDIAN_ALLOWED_ROOTS:}
        batch-size: ${KNOWLEDGE_OBSIDIAN_BATCH_SIZE:25}
        max-file-bytes: 2097152
    async:
      lease-duration: 2m
      recovery-interval: 30s
      initial-delay: 10s
      recovery-batch-size: 2
    indexing:
      batch-size: 1
      poll-interval: 1s
      lease-duration: 5m
      max-attempts: 5
      initial-backoff: 2s
      max-backoff: 5m
    embedding:
      enabled: ${KNOWLEDGE_EMBEDDING_ENABLED:false}
      provider: zhipu
      model: embedding-3
      dimensions: 2048
      generation: ${KNOWLEDGE_EMBEDDING_GENERATION:v2}
      endpoint: https://open.bigmodel.cn/api/paas/v4/embeddings
      api-key: ${ZHIPU_API_KEY:}
      request-timeout: 30s
      max-batch-size: 32
      max-attempts: 3
      initial-backoff: 250ms
      proxy-host: ${KNOWLEDGE_EMBEDDING_PROXY_HOST:}
      proxy-port: ${KNOWLEDGE_EMBEDDING_PROXY_PORT:0}
    vector:
      enabled: ${KNOWLEDGE_VECTOR_ENABLED:false}
      uri: ${KNOWLEDGE_MILVUS_URI:http://localhost:19530}
      token: ${KNOWLEDGE_MILVUS_TOKEN:}
      collection-prefix: knowledge_chunks
      partition-count: 64
      connect-timeout: 10s
      rpc-deadline: 30s
    keyword:
      elasticsearch:
        enabled: ${KNOWLEDGE_ELASTICSEARCH_ENABLED:false}
        endpoint: ${KNOWLEDGE_ELASTICSEARCH_ENDPOINT:http://localhost:9200}
        index-name: ${KNOWLEDGE_ELASTICSEARCH_INDEX:knowledge_chunks_v1}
        api-key: ${KNOWLEDGE_ELASTICSEARCH_API_KEY:}
        username: ${KNOWLEDGE_ELASTICSEARCH_USERNAME:}
        password: ${KNOWLEDGE_ELASTICSEARCH_PASSWORD:}
        connect-timeout: 5s
        request-timeout: 15s
